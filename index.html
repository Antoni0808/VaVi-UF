<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fine As Wine</title>
    <style>
        body {
            margin: 0;
            font-family: Cursive, sans-serif;
            background: linear-gradient(135deg, #4e73df, #1cc88a);
            color: white;
            text-align: center;
        }

        header {
            padding: 60px 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2rem;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: white;
            color: #4e73df;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #f8f9fc;
            transform: scale(1.05);
        }

        section {
            padding: 50px 20px;
            background-color: rgba(0, 0, 0, 0.2);
        }

        footer {
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.3);
            font-size: 0.9rem;
        }

 .full-center {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.full-center img {
    max-width: 90%;
    height: auto;
}
        
    </style>
</head>
<body>

    <header>
        <h1>Välkommen till Fine as Wine</h1>
        <p>Svensk ledare på alkohol marknaden.</p>
        <a href="#om" class="btn">Läs mer</a>
    </header>

    <section id="om">
        <h2>Om mig</h2>
        <p>Två stekare som diggar o vaska, o lite tösar på det va.</p>
    </section>

    <section>
        <h2>Produkter</h2>
        <p>Skumpa Bärs Cider</p>
        <div class="full-center">
        <img src="bild.png" alt="Champagneglas">
</div>
    </section>

    <footer>
        © 2026 Fine as Wine | Skapad med HTML & CSS
    </footer>

</body>
</html>
